version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CV_SERVICE_URL=http://cv-service:8000
    env_file:
      - ./backend/.env
    depends_on:
      - cv-service

  cv-service:
    build: ./cv-service
    ports:
      - "8000:8000"
    env_file:
      - ./cv-service/.env

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
